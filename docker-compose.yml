services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: mediscope
      POSTGRES_PASSWORD: mediscope_local
      POSTGRES_DB: mediscope
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - mediscope_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mediscope -d mediscope"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  mediscope_pgdata: